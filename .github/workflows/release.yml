name: Release

# The release robot. Every commit that lands on main is read, and a single
# permanent pull request is kept up to date with the next version number and
# the changelog it would publish. Nothing else happens until that pull
# request is merged — merging it is what tags the version, writes the
# release notes, and starts the deployment below.
#
# The action is pinned to a commit rather than a tag: a tag can be moved to
# different code later, a commit cannot. Dependabot raises that pin.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing is granted to the workflow as a whole; each job asks for what it
# needs and no more.
permissions: {}

# One release at a time. Two runs writing the same pull request would fight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Keep the release pull request up to date
    runs-on: ubuntu-latest
    permissions:
      # Writes the tag and the release notes, and keeps the release pull
      # request up to date. It needs nothing else.
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: Deploy the released version
    needs: release-please
    # A release made with the standard GitHub token does not start other
    # workflows on its own, so the deployment is called from here rather than
    # left to listen for a published release that would never reach it.
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      # What lets npm publish without a token.
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
