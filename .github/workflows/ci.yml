name: CI

# Every pull request is checked three ways: the library has to build and pass
# its tests, the showcase site has to type-check, and the commits themselves
# have to be shaped the way the release robot expects. A badly shaped commit
# costs a line in the changelog.
#
# Actions are pinned to a commit rather than a tag: a tag can be moved to
# different code later, a commit cannot. Dependabot raises these pins.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Checkout leaves its token in .git/config unless told not to, where
          # anything running later in the job could read it. Nothing here
          # writes to the repository, so the token is dropped.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  site:
    name: Site types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The site reads the components straight from ../src, so this also says
      # whether a change to the library still fits the way the site uses it.
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site

  commits:
    name: Commit format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The whole branch is needed: the check reads every commit the pull
          # request would add, not just the last one.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the commits in this pull request
        run: node scripts/check-commits.mjs "${BASE}..${HEAD}"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
