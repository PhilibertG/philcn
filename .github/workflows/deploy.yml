name: Deploy

# Called by the release workflow once a version has been tagged, and nowhere
# else — a plain push never reaches this file. It can also be run by hand for
# a tag that is already published, to replay a delivery.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag that was just released, for example v0.1.0.
        required: true
        type: string
    # Named one by one rather than inherited: the caller hands over these
    # three and nothing else, so nothing else can leak this way.
    secrets:
      DEPLOY_HOST:
        required: false
      DEPLOY_USER:
        required: false
      DEPLOY_SSH_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to deploy, for example v0.1.0.
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    name: Deliver ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner prove to npm that this publish really comes from this
      # repository and this workflow. That proof replaces a token entirely.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Publishing without a token needs npm 11.5.1 or later, which is
          # what Node 24 ships with.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Nothing is delivered that does not build and pass its tests, even
      # though the same check already ran on the pull request: the tag is what
      # reaches people, so the tag is what gets checked.
      - run: npm run check

      - name: Work out where this version goes
        id: target
        run: echo "name=${DEPLOY_TARGET:-none}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}

      # The tag reaches the shell through the environment, never pasted into
      # the script: a value spliced into a command line is read as part of
      # the command, and a crafted one would run.
      - name: No target set, nothing delivered
        if: steps.target.outputs.name == 'none'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "::notice title=Nothing to deploy::Version $TAG is tagged and its release notes are published, but no delivery target is configured. Set the repository variable DEPLOY_TARGET to 'npm' or 'ssh' to turn this on."

      # No token anywhere: npm checks the runner's own identity against the
      # trusted publisher configured on the package, and records where the
      # version was built.
      - name: Publish to npm
        if: steps.target.outputs.name == 'npm'
        run: npm publish --access public --provenance

      - name: Deploy over SSH
        if: steps.target.outputs.name == 'ssh'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_COMMAND; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing setting::$name is not set, so the deployment cannot run."
              exit 1
            fi
          done

          # The key lives in the repository secrets and only ever exists on
          # this runner, for the length of this job.
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "TAG=$TAG $DEPLOY_COMMAND"

      - name: Say what happened
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          {
            echo "### $TAG"
            echo
            echo "Target: \`$TARGET\`"
          } >> "$GITHUB_STEP_SUMMARY"
